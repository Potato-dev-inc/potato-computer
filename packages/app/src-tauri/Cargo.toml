[package]
name = "puppet_master_app"
version = "0.2.2"
description = "Puppet Master desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.91"
default-run = "puppet_master_app"

[lib]
name = "puppet_master_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "process", "io-util", "time"] }
parking_lot = "0.12"
once_cell = "1"
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
subtle = "2"
# My computers (desk/): pure geometry and wire types ported from desktoplab (MIT).
desk-core = { path = "crates/desk-core" }
desk-proto = { path = "crates/desk-proto" }
# The shared PC link (`p2p/`): QUIC connections dialed by public key.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = "=0.13.11"
async-trait = "0.1"
bytes = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_Shell_Common"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Dev and test builds (`test` inherits `dev`): line tables only for this crate (panics and backtraces
# keep file:line) and no debug info for dependencies. Full debug info doubled the target folder
# (6.4 GB -> 2.9 GB without it) and slowed every link; nothing here reads more than line tables. For
# a debugger session, `CARGO_PROFILE_DEV_DEBUG=true` gives this crate full debug info again.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
